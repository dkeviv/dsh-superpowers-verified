name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # macOS and Linux only: the installer is a bash script that assumes a POSIX
    # shell, and the vendored skills' helper scripts do too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run test suite
        run: bash tests/run.sh

      - name: Install into a scratch prefix and verify the result
        run: |
          set -euo pipefail
          prefix="$(mktemp -d)"
          ./bin/install.sh --target "$prefix/skills" --dsh-home "$prefix/dsh" >/dev/null
          test "$(find "$prefix/skills" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "15"
          grep -qF 'DeepSeek Harness (DSH)' "$prefix/skills/using-superpowers/SKILL.md"
          grep -qF 'BEGIN dsh-superpowers-verified bootstrap' "$prefix/dsh/AGENTS.md"
          ./bin/install.sh --target "$prefix/skills" --dsh-home "$prefix/dsh" --uninstall >/dev/null
          test ! -e "$prefix/dsh/AGENTS.md"

      # bin/verify.sh resolves the live DSH catalog, so it needs the real DSH
      # packages. Fetch them; if that is unavailable, skip rather than fail —
      # tests/run.sh already covers the verifier's own logic either way.
      - name: Verify against the live DSH catalog
        continue-on-error: true
        run: |
          set -euo pipefail
          npm install --no-save @deepseek-ai/dsh 2>&1 | tail -5
          ls -d node_modules/@deepseek-ai/dsh-skill 2>/dev/null || { echo "SKIP: dsh-skill not present after install"; exit 0; }
          prefix="$(mktemp -d)"
          ./bin/install.sh --target "$prefix/skills" --dsh-home "$prefix/dsh" >/dev/null
          ./bin/verify.sh --modules "$PWD/node_modules" --target "$prefix/skills" --dsh-home "$prefix/dsh"
          echo "--- modes after install ---"
          stat -c '%a %n' "$prefix/dsh/AGENTS.md" 2>/dev/null || stat -f '%Lp %N' "$prefix/dsh/AGENTS.md"

      - name: Shell and JS syntax check
        run: |
          bash -n bin/install.sh
          bash -n bin/verify.sh
          bash -n lib/session-start.sh
          bash -n tests/run.sh
          node --check lib/dsh-resolve-skills.mjs
          node --check lib/patch-using-superpowers.mjs
